name: Test tracker
on:
  push:
    paths:
      - 'tracker/**'
      - 'tests/**'
      - 'config.json'
      - 'sources.json'
      - 'search-queries.json'
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m tracker doctor
      - run: python -m unittest discover -s tests -v
